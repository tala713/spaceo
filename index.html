<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPACEO | NASA Space Apps Qena</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="intro.css">
    <style>
        body, h1, h2, h3, p, span, strong, div, button { color: #f8fafc; }
        .nasa-red { color: #ef4444 !important; }
        .qena-loc, .cyan-text, .m-meta, .diag-title { color: #38bdf8 !important; }
        .green-text { color: #10b981 !important; }
        .red-text { color: #ef4444 !important; }
        .space-bg { pointer-events: none; }
        #story-intro-overlay { z-index: 9000; }
        .intro-top, .intro-top button { position: relative; z-index: 9999; cursor: pointer; }
    </style>
</head>
<body data-screen="home" data-level="1" data-result="pass">
<div class="space-bg"></div>

<!-- شاشة الفيديو الافتتاحي (نسخة واحدة فقط) -->
<div id="story-intro-overlay" class="intro-overlay" style="display: none;">
    <div class="intro-top">
        <span class="ai-badge">🎬 SPACEO: THE STORY</span>
        <button id="skip-intro-btn" onclick="closeIntroVideo()">SKIP ⏭</button>
    </div>

    <div class="intro-stage">
        <video id="intro-video-player" class="intro-video" playsinline controls muted autoplay>
            <source src="intro.mp4" type="video/mp4">
        </video>
    </div>
</div>

<div class="container">
    <section id="screen-home" class="screen active">
        <div class="top-bar">
            <div class="nasa-badge"><span class="nasa-red">NASA</span><strong>SPACE APPS</strong><span class="qena-loc">📍 QENA</span></div>
            <div class="hero-title">
                <h1>SPACEO</h1>
                <p>Launch your ambition. Solve challenges. Make a difference.</p>
                <button class="nav-pill-sm" style="margin-top: 12px;" onclick="openIntroVideoManually()">🎬 WATCH STORY INTRO</button>
            </div>
        </div>
        <div class="home-main-area">
            <div class="prep-card">
                <div class="progress-pill"><div class="progress-fill" id="home-progress-fill" style="height: 0%;"></div></div>
                <div class="prep-text">Mission Prep<br>Status:<br><strong id="home-progress-text">0% Complete</strong></div>
            </div>
            <div class="home-actions">
                <div class="action-card card-purple" onclick="goToScreen('screen-missions')"><div class="card-icon">🚀</div><div class="card-label">START NEW<br>MISSION</div></div>
                <div class="action-card card-blue" onclick="openCurrentLab()"><div class="card-icon">🛰️</div><div class="card-label">MISSION LAB<br>& ASSEMBLY</div></div>
                <div class="action-card card-teal" onclick="goToScreen('screen-training')"><div class="card-icon">🪐</div><div class="card-label">TRAINING<br>& RULES</div></div>
            </div>
        </div>
        <div class="home-budget-bar">
            <div class="budget-text">CURRENT BUDGET: <span id="home-current-budget">$150,000</span> &nbsp;|&nbsp; TARGET: <span id="home-target-budget">$500,000</span></div>
            <div class="budget-track"><div class="budget-glow" id="home-budget-glow" style="width: 30%;"></div></div>
        </div>
    </section>

    <!-- باقي الأقسام كما هي (المهمات، التجميع، الإطلاق، التقرير، التدريب) -->
</div>

<script src="data.js?v=7"></script>
<script src="app.js?v=7"></script>

<script>
    const introOverlay = document.getElementById('story-intro-overlay');
    const introVideo = document.getElementById('intro-video-player');

    function closeIntroVideo() {
        introVideo.pause();
        introVideo.currentTime = 0;
        introOverlay.style.display = 'none';
        localStorage.setItem('spaceo_visited', 'true');
    }

    introVideo.onended = closeIntroVideo;

    window.addEventListener('DOMContentLoaded', () => {
        if (!localStorage.getItem('spaceo_visited')) {
            introOverlay.style.display = 'flex';
            introVideo.play().catch(() => {
                introVideo.muted = true;
                introVideo.play();
            });
        }
    });

    function openIntroVideoManually() {
        introOverlay.style.display = 'flex';
        introVideo.muted = false;
        introVideo.currentTime = 0;
        introVideo.play();
    }
</script>
</body>
</html>
